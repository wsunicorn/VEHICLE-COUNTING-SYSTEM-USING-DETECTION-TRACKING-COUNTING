<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DTC Vehicle Counting">
  <!-- Background rounded square with gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e6ba8"/>
      <stop offset="100%" stop-color="#189a5e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Car silhouette (top view / side view simplified) -->
  <!-- Car body -->
  <rect x="10" y="30" width="44" height="14" rx="5" fill="#ffffff" opacity="0.95"/>
  <!-- Cabin roof bump -->
  <rect x="19" y="22" width="26" height="10" rx="4" fill="#ffffff" opacity="0.95"/>
  <!-- Windshields (dark glass) -->
  <rect x="21" y="23.5" width="9" height="7" rx="2" fill="#0e6ba8" opacity="0.7"/>
  <rect x="34" y="23.5" width="9" height="7" rx="2" fill="#0e6ba8" opacity="0.7"/>
  <!-- Wheels -->
  <circle cx="19" cy="44" r="5" fill="#1a2e3b"/>
  <circle cx="19" cy="44" r="2.5" fill="#c8dde9"/>
  <circle cx="45" cy="44" r="5" fill="#1a2e3b"/>
  <circle cx="45" cy="44" r="2.5" fill="#c8dde9"/>
  <!-- Headlight -->
  <rect x="52" y="33" width="4" height="5" rx="1.5" fill="#ffd700" opacity="0.9"/>
  <!-- Taillight -->
  <rect x="8" y="33" width="4" height="5" rx="1.5" fill="#ff6b6b" opacity="0.9"/>

  <!-- Speed/count tick marks above -->
  <line x1="28" y1="10" x2="28" y2="16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="36" y1="8" x2="36" y2="15" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="44" y1="10" x2="44" y2="16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
</svg>
